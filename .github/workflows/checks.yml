name: Public research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: node scripts/build-demo.mjs
      - run: node scripts/check-public.mjs
      - run: node scripts/check-english.mjs
      - run: python -m unittest discover -s tests -v
      - run: python tests/execute_notebook.py
      - name: Ensure published static demo matches source
        run: git diff --exit-code -- docs/index.html
